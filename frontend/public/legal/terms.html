<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>利用規約 | Drive Map</title>
    <style>
      :root {
        color-scheme: light;
        font-family: "Hiragino Kaku Gothic ProN", "Yu Gothic", sans-serif;
      }
      body {
        margin: 0;
        background: #f6f8fb;
        color: #1f2937;
      }
      main {
        width: min(900px, 100%);
        margin: 0 auto;
        padding: 2rem 1rem 3rem;
      }
      section {
        background: #fff;
        border-radius: 12px;
        padding: 1rem;
        box-shadow: 0 6px 20px rgba(15, 23, 42, 0.06);
        margin-top: 1rem;
      }
      ul {
        margin: 0.5rem 0 0;
        padding-left: 1.2rem;
      }
      a {
        color: #0f5cd8;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>利用規約</h1>
      <section>
        <h2>1. 案内情報の取り扱い</h2>
        <p>
          本サービスの案内は参考情報であり、正確性・完全性・最新性を保証するものではありません。実際の交通規制、標識、道路状況を常に優先してください。
        </p>
      </section>
      <section>
        <h2>2. 禁止事項</h2>
        <ul>
          <li>危険運転を誘発する利用</li>
          <li>法令に違反する目的での利用</li>
          <li>サービスの運用を妨害する行為</li>
        </ul>
      </section>
      <section>
        <h2>3. 免責</h2>
        <p>
          本サービスの利用に関連して生じた損害について、当方は法令上認められる範囲で責任を負いません。
        </p>
      </section>
      <p><a href="/">アプリに戻る</a></p>
    </main>
  </body>
</html>
